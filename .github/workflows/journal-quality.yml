name: Journal verification and Pages deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: journal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/prepare_theme.py
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python tools/test_journal_themes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-test-evidence
          path: test-results/
      - name: Assemble verified static website
        run: |
          mkdir -p _site
          python - <<'PY'
          import pathlib, shutil
          root = pathlib.Path('.')
          for source in root.iterdir():
              if source.name in {'_site', '.git', '.github', 'test-results', 'README.md'} or source.name.startswith('.'):
                  continue
              target = pathlib.Path('_site') / source.name
              if source.is_dir():
                  shutil.copytree(source, target, ignore=shutil.ignore_patterns('*.py', '__pycache__'))
              elif source.suffix.lower() in {'.html', '.css', '.js', '.json', '.svg', '.png', '.jpg', '.jpeg', '.webp', '.ico', '.txt', '.xml'} or source.name == 'CNAME':
                  shutil.copy2(source, target)
          PY
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
